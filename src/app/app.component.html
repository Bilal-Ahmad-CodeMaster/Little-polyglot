<!-- Top progress shimmer bar -->
<div *ngIf="loader.isLoading" class="app-top-loader notranslate" role="progressbar" aria-label="Loading">
    <div class="app-top-loader__track">
        <div class="app-top-loader__bar"></div>
    </div>
</div>
<router-outlet></router-outlet>

</app-language-convertor>
<!-- Language switcher temporarily hidden; re-enable by removing *ngIf="false" -->
<button *ngIf="false" (click)="onOpen()"
    class="notranslate fixed z-50 bottom-5 right-5 flex items-center gap-2 px-5 py-3 bg-primary text-white hover:bg-primary-hover rounded-full shadow-lg transition-all duration-300 text-base font-medium">
    🌐 {{ currentLanguage.language }}
</button>
