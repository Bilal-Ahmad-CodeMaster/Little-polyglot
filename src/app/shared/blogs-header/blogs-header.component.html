<header class="sticky top-0 z-40 border-b border-[#eee5df] bg-white/95 backdrop-blur">
  <div class="mx-auto max-w-6xl px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between gap-4 py-2.5 text-sm">
      <a routerLink="/" class="font-semibold text-slate-500 transition hover:text-[#FF6B35]">
        ← Wróć do strony głównej
      </a>

      <button
        class="inline-flex h-10 w-10 items-center justify-center rounded-full border border-slate-200 text-slate-700 sm:hidden"
        (click)="isMenuOpen = !isMenuOpen"
        aria-label="Przełącz menu bloga">
        <i class="fas" [ngClass]="isMenuOpen ? 'fa-times' : 'fa-bars'"></i>
      </button>

      <a routerLink="/blogs/contact" class="hidden font-semibold text-slate-500 transition hover:text-[#FF6B35] sm:block">
        Kontakt
      </a>
    </div>


    </div>

    <nav
      [ngClass]="isMenuOpen ? 'flex' : 'hidden sm:flex'"
      class="flex-col items-center gap-2 border-t border-[#f3ebe6] py-3 sm:flex-row sm:flex-wrap sm:justify-center sm:gap-2">
      <a routerLink="/blogs" routerLinkActive="activlink" [routerLinkActiveOptions]="{ exact: true }" class="blog-nav-pill">
        Wszystkie posty
      </a>

      <div class="relative hidden sm:block group">
        <a routerLink="/blogs/education" routerLinkActive="activlink" class="blog-nav-pill">
          Wychowanie
        </a>
        <div class="blog-hover-panel">
          <div class="blog-hover-panel__inner">
            <p class="blog-hover-panel__title">Najnowsze w kategorii</p>
            <button *ngFor="let blog of educationBlog" type="button" (click)="onBlogClick(blog._id)" class="blog-hover-item">
              <img [src]="getCover(blog)" [alt]="blog?.title" class="h-12 w-12 rounded-xl object-cover" />
              <div>
                <p class="line-clamp-2 text-sm font-semibold text-slate-800">{{ blog?.title }}</p>
                <p class="text-xs text-slate-500">{{ blog?.createdAt | date : 'd MMM y' }}</p>
              </div>
            </button>
          </div>
        </div>
      </div>

      <div class="relative hidden sm:block group">
        <a routerLink="/blogs/creativeLearning" routerLinkActive="activlink" class="blog-nav-pill">
          Kreatywna nauka
        </a>
        <div class="blog-hover-panel">
          <div class="blog-hover-panel__inner">
            <p class="blog-hover-panel__title">Najnowsze w kategorii</p>
            <button *ngFor="let blog of creativeBlog" type="button" (click)="onBlogClick(blog._id)" class="blog-hover-item">
              <img [src]="getCover(blog)" [alt]="blog?.title" class="h-12 w-12 rounded-xl object-cover" />
              <div>
                <p class="line-clamp-2 text-sm font-semibold text-slate-800">{{ blog?.title }}</p>
                <p class="text-xs text-slate-500">{{ blog?.createdAt | date : 'd MMM y' }}</p>
              </div>
            </button>
          </div>
        </div>
      </div>

      <div class="relative hidden sm:block group">
        <a routerLink="/blogs/interestingPlaces" routerLinkActive="activlink" class="blog-nav-pill">
          Ciekawe miejsca
        </a>
        <div class="blog-hover-panel">
          <div class="blog-hover-panel__inner">
            <p class="blog-hover-panel__title">Najnowsze w kategorii</p>
            <button *ngFor="let blog of interestingPlaces" type="button" (click)="onBlogClick(blog._id)" class="blog-hover-item">
              <img [src]="getCover(blog)" [alt]="blog?.title" class="h-12 w-12 rounded-xl object-cover" />
              <div>
                <p class="line-clamp-2 text-sm font-semibold text-slate-800">{{ blog?.title }}</p>
                <p class="text-xs text-slate-500">{{ blog?.createdAt | date : 'd MMM y' }}</p>
              </div>
            </button>
          </div>
        </div>
      </div>

      <a routerLink="/blogs/education" routerLinkActive="activlink" class="blog-nav-pill sm:hidden">
        Wychowanie
      </a>
      <a routerLink="/blogs/creativeLearning" routerLinkActive="activlink" class="blog-nav-pill sm:hidden">
        Kreatywna nauka
      </a>
      <a routerLink="/blogs/interestingPlaces" routerLinkActive="activlink" class="blog-nav-pill sm:hidden">
        Ciekawe miejsca
      </a>

      <a routerLink="/about" routerLinkActive="activlink" class="blog-nav-pill">
        O nas
      </a>
      <a routerLink="/blogs/contact" routerLinkActive="activlink" class="blog-nav-pill sm:hidden">
        Kontakt
      </a>
    </nav>
  </div>
</header>
