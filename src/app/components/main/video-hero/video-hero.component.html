<div class="video-reel mx-auto w-full max-w-[320px] sm:max-w-[360px] lg:max-w-full" aria-label="Wideo Polyglot Kids">
  <div class="video-reel__card relative aspect-[9/16] w-full overflow-hidden rounded-3xl bg-slate-900 shadow-[0_20px_50px_rgba(15,23,42,0.18)] ring-1 ring-black/5">
    @for (src of videos; track src; let i = $index) {
      <video
        #heroVideo
        class="video-reel__video"
        [class.video-reel__video--active]="isActive(i)"
        [attr.src]="shouldLoad(i) ? src : null"
        playsinline
        muted
        autoplay
        loop
        [attr.preload]="isActive(i) ? 'auto' : 'none'"
        disablePictureInPicture
        controlsList="nodownload noplaybackrate noremoteplayback"
        [attr.aria-hidden]="!isActive(i)"
        (canplay)="onCanPlay(i)"
      ></video>
    }

    <!-- Subtle reel-style vignette -->
    <div class="pointer-events-none absolute inset-0 bg-gradient-to-b from-black/10 via-transparent to-black/20"></div>
  </div>
</div>
