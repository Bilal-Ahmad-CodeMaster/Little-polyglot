<div class="video-hero mx-auto w-full max-w-[26rem]">
  <div class="video-hero__card relative overflow-hidden rounded-[2rem] border border-white/70 bg-white p-2 shadow-[0_30px_70px_rgba(15,23,42,0.16)]">
    <div class="video-hero__reel relative aspect-[9/16] overflow-hidden rounded-[1.5rem] bg-slate-200">
      @for (src of videos; track src; let i = $index) {
        <video
          #heroVideo
          class="video-hero__video"
          [class.video-hero__video--active]="isActive(i)"
          [attr.src]="shouldLoad(i) ? src : null"
          autoplay
          muted
          playsinline
          preload="metadata"
          disablePictureInPicture
          controlsList="nodownload noplaybackrate noremoteplayback nofullscreen"
          [attr.aria-hidden]="!isActive(i)"
          (canplay)="onCanPlay(i)"
        >
          Twoja przeglądarka nie obsługuje odtwarzania wideo HTML5.
        </video>
      }

      <div class="pointer-events-none absolute inset-x-0 top-0 h-28 bg-gradient-to-b from-black/20 to-transparent"></div>
      <div class="pointer-events-none absolute inset-x-0 bottom-0 h-36 bg-gradient-to-t from-black/28 to-transparent"></div>
    </div>
  </div>
</div>
