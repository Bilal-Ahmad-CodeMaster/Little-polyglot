<app-header></app-header>

<nav class="bg-gray-100 py-2 px-4 flex gap-4 shadow">

    <a routerLink="/adminPanel/dashboard" routerLinkActive="font-bold text-primary"
        [routerLinkActiveOptions]="{ exact: true }" class="hover:text-primary-hover">Dashboard</a>
    <a routerLink="/adminPanel/branches" routerLinkActive="font-bold text-primary"
        [routerLinkActiveOptions]="{ exact: true }" class="hover:text-primary-hover">Branches</a>
    <a routerLink="/adminPanel/blogs" routerLinkActive="font-bold text-primary"
        [routerLinkActiveOptions]="{ exact: true }" class="hover:text-primary-hover">Blogs</a>
    <a routerLink="/adminPanel/profile" routerLinkActive="font-bold text-primary"
        [routerLinkActiveOptions]="{ exact: true }" class="hover:text-primary-hover">Profile</a>
</nav>

<main class="admin-main relative p-6">
    <div *ngIf="loader.isLoading" class="admin-loader-overlay" role="status" aria-live="polite" aria-label="Loading admin data">
        <div class="admin-loader-card">
            <div class="admin-loader-spinner"></div>
            <p class="admin-loader-text">Loading admin data...</p>
        </div>
    </div>
    <router-outlet></router-outlet>
</main>
