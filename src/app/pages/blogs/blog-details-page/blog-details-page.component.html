<app-blogs-header></app-blogs-header>

<div class="bg-[#fcfaf8] px-4 py-10 sm:px-6 lg:px-8" *ngIf="blog; else loadingState">
  <div class="mx-auto max-w-5xl space-y-8">
    <a routerLink="/blogs" class="inline-flex items-center rounded-full border border-slate-200 bg-white px-4 py-2 text-sm font-semibold text-slate-600 transition hover:border-[#FF6B35] hover:text-[#FF6B35]">
      ← Wróć do bloga
    </a>

    <article class="overflow-hidden rounded-[2rem] border border-[#eceff3] bg-white shadow-[0_24px_60px_rgba(15,23,42,0.06)]">
      <div class="px-6 pt-8 sm:px-10 sm:pt-10">
        <div class="flex flex-wrap items-center gap-3 text-sm font-semibold">
          <span class="rounded-full bg-[#fff3ed] px-3 py-1 text-[#FF6B35]">{{ blog?.category }}</span>
          <span class="text-slate-400">{{ blog?.createdAt | date : 'd MMMM y' }}</span>
        </div>

        <h1 *ngIf="blog?.title" class="mt-4 text-3xl font-extrabold leading-tight text-slate-900 sm:text-4xl">
          {{ blog.title }}
        </h1>
      </div>

      <div *ngIf="blog?.imagesGallery?.[0]?.imageUrl" class="mt-8">
        <img [src]="blog.imagesGallery[0].imageUrl" [alt]="blog?.title" class="h-auto w-full object-cover sm:max-h-[560px]" />
      </div>

      <div class="px-6 py-8 sm:px-10 sm:py-10">
        <p *ngIf="blog?.description" class="blog-copy whitespace-pre-line text-lg leading-8 text-slate-700">
          {{ blog.description }}
        </p>

        <div *ngIf="blog?.imagesGallery?.length > 1" class="mt-10 grid gap-5 sm:grid-cols-2">
          <img *ngFor="let img of blog.imagesGallery.slice(1)"
            [src]="img?.imageUrl"
            [alt]="blog?.title"
            class="h-full w-full rounded-[1.5rem] object-cover shadow-sm" />
        </div>

        <div *ngIf="blog?.subDescription" class="mt-10 rounded-[1.5rem] bg-[#fff8f3] p-6 ring-1 ring-[#ffe2d5]">
          <h2 class="text-lg font-bold text-slate-900">Dalsza część artykułu</h2>
          <p class="blog-copy mt-4 whitespace-pre-line text-base leading-8 text-slate-700">
            {{ blog.subDescription }}
          </p>
        </div>
      </div>
    </article>
  </div>
</div>

<ng-template #loadingState>
  <div class="bg-[#fcfaf8] px-4 py-16 sm:px-6 lg:px-8">
    <div class="mx-auto max-w-5xl rounded-[2rem] border border-[#eceff3] bg-white p-10 text-center text-slate-500 shadow-sm">
      Ładowanie artykułu...
    </div>
  </div>
</ng-template>

<app-blogs-footer></app-blogs-footer>
